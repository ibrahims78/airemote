version: "3.9"

# v3.7.0 — no insecure defaults.
#   export JWT_SECRET=$(openssl rand -hex 32)
#   export CREDENTIALS_KEY=$(openssl rand -hex 32)
#   export DASHBOARD_URL=https://your-host
# TLS: terminate at a reverse proxy (Caddy/Traefik) in front of :8080 and set
# TRUST_PROXY=true, or mount certs and set TLS_CERT_PATH/TLS_KEY_PATH.

services:
  server:
    build:
      context: ..
      dockerfile: docker/Dockerfile.server
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=3001
      - HOST=0.0.0.0
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET is required}
      - CREDENTIALS_KEY=${CREDENTIALS_KEY:?CREDENTIALS_KEY is required}
      - DB_PATH=/app/data/airemote.db
      - DASHBOARD_URL=${DASHBOARD_URL:-http://localhost:8080}
      - TRUST_PROXY=${TRUST_PROXY:-false}
    volumes:
      - airemote_data:/app/data
    networks:
      - airemote_net
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3

  dashboard:
    build:
      context: ..
      dockerfile: docker/Dockerfile.dashboard
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      server:
        condition: service_healthy
    networks:
      - airemote_net

volumes:
  airemote_data:

networks:
  airemote_net:
    driver: bridge
