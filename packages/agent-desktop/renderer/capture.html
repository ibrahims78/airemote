<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <style>
    body { margin: 0; background: #000; overflow: hidden; }
    /* v3.5 — display:none froze the MediaStream video on Windows (only the first
       frame was ever drawn). Keep it technically visible but 2x2 and transparent. */
    video {
      position: fixed; left: -4px; top: -4px;
      width: 2px; height: 2px; opacity: 0.01;
      pointer-events: none;
    }
    canvas { display: none; }
  </style>
</head>
<body>
<video id="v" autoplay muted playsinline></video>
<canvas id="c"></canvas>
<script>
'use strict'
/* global require */
// desktopCapturer is main-process-only in Electron 20+.
// Strategy 1: getDisplayMedia() — works because main process sets setDisplayMediaRequestHandler.
// Strategy 2: getUserMedia() with chromeMediaSource — legacy fallback.
// Sources (for monitor selection) are always fetched from main via IPC.
const { ipcRenderer } = require('electron')

const video  = document.getElementById('v')
const canvas = document.getElementById('c')
const ctx    = canvas.getContext('2d')

// v3.3.2 — delta engine state (small sampler for fast change detection)
const regionCanvas = document.createElement('canvas')
const regionCtx    = regionCanvas.getContext('2d')
let   sampleCanvas = null
let   sampleCtx    = null
let   prevSample   = null
let   lastFullAt   = 0
let   forceFull    = false   // v3.8.12 — يطلبه السيرفر عند التحاق مشاهد جديد

let sessionId       = null
let captureTimer    = null
let frameSeq        = 0
let currentFps      = 20
let currentQuality  = 80
let stream          = null
let cachedSources   = []   // [{id, name, index}] from main process
let currentMaxWidth = 1280
let lastTrackRestartAt = 0
let lastMonitorIdx = 0
let encoding        = false  // guard: prevent concurrent encodes
let useWebp         = true   // v3.8.7 — WebP is ~30-45% smaller than JPEG at equal quality
let webpSlowStreak  = 0      // fall back to JPEG if this CPU is slow at WebP
let webpDisabledAt  = 0      // v3.8.7 — retry WebP after 30s instead of giving up forever
let qualityScale    = 1      // v3.8.7 — adaptive resolution (0.6 … 1.0) so slow CPUs stay smooth
// 3.11.8 — حجم الإخراج يُقفل لكل جلسة: تغييره أثناء الجلسة يُبطل مسار الدلتا
// ويرسل keyframe بمقاس جديد، فيُعيد العارض ضبط canvas (مسح الصورة) ويقفز المؤشر.
let lockedW = 0, lockedH = 0
let audioCtx        = null
let audioProc       = null
let audioSource     = null
let audioSilence    = null
let audioSeq        = 0
let audioWanted     = false

// ── Get screen sources from main process (desktopCapturer) ───────────────
async function getSources() {
  try {
    const sources = await ipcRenderer.invoke('get-screen-sources')
    cachedSources = sources || []
  } catch {
    cachedSources = []
  }
  return cachedSources
}

// ── Start / restart capture ───────────────────────────────────────────────
async function startCapture(sid, fps, quality, monitorIdx, maxWidth) {
  sessionId      = sid
  currentFps     = Math.max(1, Math.min(30, fps     || 5))
  currentQuality = Math.max(10, Math.min(95, quality || 65))
  currentMaxWidth = Math.max(320, Math.min(3840, Number(maxWidth) || currentMaxWidth || 1280))
  lockedW = 0; lockedH = 0   // 3.11.8 — قفل مقاس جديد لكل جلسة
  lastMonitorIdx = monitorIdx || 0
  captureStartAt = Date.now()

  // ── 3.11.4 — استهلاك التدفق المُسخَّن إن وُجد (نفس الشاشة وأقل من 45s) ──
  const warmIdx = monitorIdx || 0
  // إن كان التسخين ما زال جارياً (getDisplayMedia يستغرق ~850ms) ننتظره بدل بدء
  // التقاط بارد ثانٍ — هذا هو الفرق بين «التسخين موجود» و«التسخين يُستخدم».
  if (!warmStream && warming) await waitForWarm(2000)
  if (warmStream && warmMonitorIdx === warmIdx && (Date.now() - warmAt) < 45000) {
    const reuse = warmStream
    const age   = Date.now() - warmAt
    stopWarm('consume')
    stopAudioRecorder()
    if (captureTimer !== null) { clearTimeout(captureTimer); captureTimer = null }
    stream     = reuse
    frameSeq   = 0
    encoding   = false
    lastFullAt = 0
    prevSample = null
    if (video.srcObject !== reuse) { try { video.srcObject = reuse; await video.play() } catch {} }
    // انتظر جهوزية الإطار (حد أقصى 2s) قبل بدء السلسلة — بدل مؤقت يعود فارغاً ويتوقف.
    if (video.readyState < 2) {
      await new Promise(resolve => {
        let n = 0
        const t = setInterval(() => {
          if (video.readyState >= 2 || ++n > 40) { clearInterval(t); resolve() }
        }, 50)
      })
    }
    if (audioWanted) startAudioRecorder(sid)
    captureTimer = setTimeout(captureFrame, 0)
    ipcRenderer.send('capture-timing', { phase: 'reuse', session: String(sid).slice(0, 8), warmAgeMs: age })
    return
  }
  if (warmStream) stopWarm('switch')

  stopCapture()

  let lastErr = null

  // Strategy 1: getDisplayMedia() — preferred in Electron 21+ because
  // setDisplayMediaRequestHandler bypasses the picker and grants directly.
  try {
    // v3.3.0 — try to exclude the OS cursor from captured frames (single-cursor UX)
    stream = await navigator.mediaDevices.getDisplayMedia({ video: { cursor: 'never' }, audio: true })
    await startFromStream(sid)
    return
  } catch (e0) {
    try {
      stream = await navigator.mediaDevices.getDisplayMedia({ video: true, audio: true })
      await startFromStream(sid)
      return
    } catch (e1) {
      lastErr = e1
    }
  }

  // Strategy 2: getUserMedia() with desktopCapturer source ID (legacy).
  try {
    const sources = await getSources()
    if (!sources.length) throw new Error('No screens available')

    const idx      = Math.max(0, Math.min(monitorIdx || 0, sources.length - 1))
    const sourceId = sources[idx].id

    stream = await navigator.mediaDevices.getUserMedia({
      audio: false,
      video: {
        mandatory: {
          chromeMediaSource:   'desktop',
          chromeMediaSourceId: sourceId,
          maxWidth:            1920,
          maxHeight:           1080,
          maxFrameRate:        currentFps
        }
      }
    })
    await startFromStream(sid)
    return
  } catch (e2) {
    lastErr = e2
  }

  // Both strategies failed
  const msg = (lastErr && (lastErr.message || String(lastErr))) || 'getUserMedia failed'
  ipcRenderer.send('screen-error', { sessionId: sid, message: msg })
}

// ── Called once a stream is acquired ────────────────────────────────────
async function startFromStream(sid) {
  video.srcObject = stream
  await new Promise((resolve, reject) => {
    video.onloadedmetadata = resolve
    setTimeout(() => reject(new Error('Video metadata timeout')), 8000)
  })
  // v3.5 — explicitly start playback; autoplay alone left the track paused in
  // the hidden capture window, so every captured frame was identical.
  try { video.muted = true; await video.play() } catch (e) {}
  frameSeq     = 0
  if (audioWanted) startAudioRecorder(sid)
  captureTimer = setTimeout(captureFrame, Math.round(1000 / currentFps))
  try {
    const vt = stream.getVideoTracks()[0]
    if (vt) vt.addEventListener('ended', () => ipcRenderer.send('screen-track-ended', { sessionId: sid }))
    if (!window.__arResizeHooked) {
      window.__arResizeHooked = true
      video.addEventListener('resize', () => ipcRenderer.send('screen-resized', { width: video.videoWidth, height: video.videoHeight }))
    }
  } catch {}

  // Report monitor list
  const sources = cachedSources.length ? cachedSources : await getSources()
  ipcRenderer.send('screen-monitors', {
    sessionId: sid,
    monitors:  sources.length
      ? sources.map((s, i) => ({ id: i, name: s.name, primary: i === 0 }))
      : [{ id: 0, name: 'Screen 1', primary: true }]
  })
}

// ── System audio (loopback) ───────────────────────────────────────────────
// ?? System audio (loopback, PCM16) ???????????????????????????????????????
// v3.5.1 - send raw PCM instead of MediaRecorder/WebM chunks. The dashboard's
// PCM path is gapless (jitter buffer) and does not depend on MediaSource,
// autoplay of a detached <audio> element, or a valid WebM initialization
// segment on every reconnect. It also lets the browser play the remote sound
// with the same path used by Android.
function stopAudioRecorder() {
  try { if (audioProc) audioProc.onaudioprocess = null } catch {}
  try { if (audioSource) audioSource.disconnect() } catch {}
  try { if (audioProc) audioProc.disconnect() } catch {}
  try { if (audioSilence) audioSilence.disconnect() } catch {}
  try { if (audioCtx && audioCtx.state !== 'closed') audioCtx.close() } catch {}
  audioProc = null
  audioSource = null
  audioSilence = null
  audioCtx = null
  // Do not stop the current stream's audio tracks here: startAudioRecorder()
  // calls this before creating the new pipeline, and stopping them makes the
  // freshly acquired loopback track "ended" before it can be read.
}

function makeAudioContext() {
  try { return new AudioContext({ sampleRate: 16000 }) } catch (e) {
    try { return new AudioContext() } catch (e2) { return null }
  }
}

function startAudioRecorder(sid) {
  stopAudioRecorder()
  try {
    const tracks = stream ? stream.getAudioTracks() : []
    if (!tracks.length) {
      ipcRenderer.send('audio-status', { sessionId: sid, ok: false, reason: 'no system audio track' })
      return
    }
    audioCtx = makeAudioContext()
    if (!audioCtx) throw new Error('AudioContext unavailable')
    const requestedRate = audioCtx.sampleRate || 16000
    audioSource = audioCtx.createMediaStreamSource(new MediaStream(tracks))
    audioProc = audioCtx.createScriptProcessor(1024, 1, 1)
    audioSilence = audioCtx.createGain()
    audioSilence.gain.value = 0
    audioProc.onaudioprocess = e => {
      if (!audioWanted || !sid) return
      const input = e.inputBuffer.getChannelData(0)
      const pcm = new Int16Array(input.length)
      for (let i = 0; i < input.length; i++) {
        let v = input[i]
        if (v > 1) v = 1; else if (v < -1) v = -1
        pcm[i] = v < 0 ? (v * 0x8000) | 0 : (v * 0x7fff) | 0
      }
      ipcRenderer.send('audio-chunk', {
        sessionId: sid,
        seq: audioSeq++,
        data: Buffer.from(pcm.buffer),
        format: 'pcm16',
        sampleRate: requestedRate,
        channels: 1
      })
    }
    audioSource.connect(audioProc)
    audioProc.connect(audioSilence)
    audioSilence.connect(audioCtx.destination)
    audioCtx.resume().catch(() => {})
    ipcRenderer.send('audio-status', {
      sessionId: sid, ok: true, format: 'pcm16', sampleRate: requestedRate, channels: 1
    })
  } catch (e) {
    stopAudioRecorder()
    ipcRenderer.send('audio-status', { sessionId: sid, ok: false, reason: String(e && e.message || e) })
  }
}

// ── Capture one frame (binary path — no base64 / JSON overhead) ──────────
// Uses canvas.toBlob() → ArrayBuffer → IPC binary transfer.
// The `encoding` flag prevents a slow JPEG encode from stacking up frames.
// v3.3.1 — adaptive pacing: re-arm after each encode so intervals stay even
function armTimer(delay) {
  clearTimeout(captureTimer)
  captureTimer = setTimeout(captureFrame, Math.max(4, Math.round(delay)))
}

// v3.3.2 — changed-region detection on a downscaled sample (fast, low memory)
function computeDelta(cw, ch) {
  const sw = Math.max(48, Math.min(480, cw >> 3))
  const sh = Math.max(18, Math.round(sw * (ch / cw)))
  if (!sampleCanvas) { sampleCanvas = document.createElement('canvas'); sampleCtx = sampleCanvas.getContext('2d', { willReadFrequently: true }) }
  if (sampleCanvas.width !== sw || sampleCanvas.height !== sh) { sampleCanvas.width = sw; sampleCanvas.height = sh; prevSample = null }
  sampleCtx.drawImage(canvas, 0, 0, sw, sh)
  const cur = sampleCtx.getImageData(0, 0, sw, sh).data
  if (!prevSample) { prevSample = cur; return null }
  let minX = 1e9, minY = 1e9, maxX = -1, maxY = -1
  for (let i = 0; i < cur.length; i += 4) {
    if (cur[i] !== prevSample[i] || cur[i + 1] !== prevSample[i + 1] || cur[i + 2] !== prevSample[i + 2]) {
      const p  = i >> 2
      const px = p % sw
      const py = (p / sw) | 0
      if (px < minX) minX = px
      if (px > maxX) maxX = px
      if (py < minY) minY = py
      if (py > maxY) maxY = py
    }
  }
  prevSample = cur
  if (maxX < 0) return { none: true }
  const sx = cw / sw, sy = ch / sh
  const x  = Math.max(0, Math.floor(minX * sx) - 24)
  const y  = Math.max(0, Math.floor(minY * sy) - 24)
  const x2 = Math.min(cw, Math.ceil((maxX + 1) * sx) + 24)
  const y2 = Math.min(ch, Math.ceil((maxY + 1) * sy) + 24)
  return { x: x, y: y, w: Math.max(8, x2 - x), h: Math.max(8, y2 - y) }
}

function captureFrame() {
  // 3.11.4 — لا تُسقط السلسلة الزمنية عند عدم جهوزية الفيديو: أعد التسليح وانتظر.
  // (كان return بلا مؤقت يوقف البث كلياً إذا وصل start-capture قبل جهوزية التدفق.)
  if (!video.videoWidth || !video.videoHeight || video.readyState < 2) {
    if (captureTimer !== null) armTimer(50)
    return
  }
  if (encoding) return   // previous encode still in progress — skip frame

  // v3.3.0 — scale to currentMaxWidth when needed (keeps JPEG encode fast and stream smooth)
  const vw = video.videoWidth
  const vh = video.videoHeight
  const baseScale = (currentMaxWidth && vw > currentMaxWidth) ? (currentMaxWidth / vw) : 1
  // 3.11.8 — المقاس من المصدر + maxWidth فقط، ويُقفل حتى نهاية الجلسة.
  const wantW = Math.max(2, Math.round(vw * baseScale))
  const wantH = Math.max(2, Math.round(vh * baseScale))
  if (lockedW !== wantW || lockedH !== wantH) {
    lockedW = wantW; lockedH = wantH
    canvas.width = lockedW; canvas.height = lockedH
    prevSample = null   // خط أساس الدلتا يُعاد بعد أي تغيير حقيقي في المصدر
  }
  const cw = lockedW
  const ch = lockedH
  ctx.drawImage(video, 0, 0, cw, ch)

  const sid = sessionId
  const w   = canvas.width
  const h   = canvas.height
  const s   = frameSeq++

  // v3.3.2 — partial-frame (delta) engine: transmit only the changed region
  // v3.8.12 — الإطار الكامل صار حدثاً نادراً (أمان كل 15s) لا إيقاعاً:
  // سطح المكتب الساكن لا يُرسل شيئاً بدل إرسال ~240KB كل 1.5s، والملتحق الجديد
  // يُخدَم بإطار كامل مطلوب من السيرفر (force-keyframe) لا بانتظار الدوري.
  const FULL_REFRESH_MS = 15000
  let mode = 'full', rx = 0, ry = 0
  if (sid) {
    let d = null
    try { d = computeDelta(cw, ch) } catch (e) {}
    const sinceFull = Date.now() - lastFullAt

    if (forceFull) {
      forceFull = false
      mode = 'full'
    } else if (d && d.none) {
      if (sinceFull < FULL_REFRESH_MS) {
        if (captureTimer !== null) armTimer(1000 / currentFps)   // شاشة ساكنة — لا شيء يُرسل
        return
      }
      mode = 'full'                                              // إطار أمان دوري
    } else if (d && !d.none && (d.w * d.h) < (cw * ch * 0.55) && sinceFull < FULL_REFRESH_MS) {
      mode = 'delta'; rx = d.x; ry = d.y
      if (regionCanvas.width !== d.w || regionCanvas.height !== d.h) { regionCanvas.width = d.w; regionCanvas.height = d.h }
      regionCtx.drawImage(canvas, d.x, d.y, d.w, d.h, 0, 0, d.w, d.h)
    }
  }

  encoding = true
  const tEnc = performance.now()
  const encW = mode === 'delta' ? regionCanvas.width  : w
  const encH = mode === 'delta' ? regionCanvas.height : h
  const encCanvas = mode === 'delta' ? regionCanvas : canvas
  const wantWebp = useWebp
  encCanvas.toBlob(blob => {
    const encMs = performance.now() - tEnc
    encoding = false
    // v3.3.1: re-arm right after encode completes — even frame intervals
    if (captureTimer !== null) armTimer((1000 / currentFps) - (performance.now() - tEnc))

    // v3.8.7 — WebP keeps quality but cuts bytes; on a slow CPU it can cost frames,
    // so three slow encodes in a row switch to JPEG, and we retry WebP a minute later.
    if (wantWebp) {
      if (encMs > 90) { if (++webpSlowStreak >= 3) { useWebp = false; webpDisabledAt = Date.now(); console.log('encoder: WebP too slow (' + Math.round(encMs) + ' ms) — switched to JPEG') } }
      else { webpSlowStreak = 0 }
    } else if (webpDisabledAt && Date.now() - webpDisabledAt > 30000) {
      useWebp = true; webpSlowStreak = 0; webpDisabledAt = 0
    }

    // 3.11.8 — تكيّف الضغط فقط (لا يمسّ أبعاد الإطار): مقاس ثابت = دلتا سليمة وبثّ مستقر.
    // which shows up as a 1-2 fps stream. Trade a little sharpness for smoothness,
    // and climb back up as soon as the encoder is fast again.
    if (encMs > 110 && qualityScale > 0.6) qualityScale = Math.max(0.6, +(qualityScale - 0.08).toFixed(2))
    else if (encMs < 45 && qualityScale < 1) qualityScale = Math.min(1, +(qualityScale + 0.04).toFixed(2))

    if (!blob || !sid) return
    if (mode === 'full') lastFullAt = Date.now()
    blob.arrayBuffer().then(buf => {
      ipcRenderer.send('screen-frame-binary', {
        sessionId: sid,
        width:     encW,
        height:    encH,
        seq:       s,
        flags:     (mode === 'delta' ? 2 : 1) | (wantWebp ? 4 : 0),   // bit0 keyframe, bit1 delta, bit2 WebP
        x:         rx,
        y:         ry,
        buffer:    Buffer.from(buf)
      })
      if (s === 0) ipcRenderer.send('capture-timing', { phase: 'first-frame-sent', session: String(sid).slice(0, 8), sinceStartMs: captureStartAt ? (Date.now() - captureStartAt) : -1 })
    }).catch(() => { /* ignore decode errors */ })
  }, wantWebp ? 'image/webp' : 'image/jpeg', currentQuality / 100)
}

// ── 3.11.4 — تسخين تدفق الالتقاط (سبب عيب أول إطار 2084ms) ──────────────
// getDisplayMedia + أول إطار كانا يبدآن عند وصول screen_start، فيدفع المشاهد
// ثمن تهيئة الالتقاط كاملة. التسخين يبدأ فور قبول الطرف الهدف (لا قبله)،
// ويُستهلك عند screen_start بلا إعادة التقاط. عمر التسخين 45s ثم يُحرَّر
// كي لا يبقى التقاط الشاشة عاملاً بلا جلسة (خصوصية + CPU).
let warmStream     = null
let warmMonitorIdx = null
let warmAt         = 0
let warmTimer      = null
let captureStartAt = 0
let warming        = false

function waitForWarm (maxMs) {
  return new Promise(resolve => {
    const t0 = Date.now()
    const iv = setInterval(() => {
      if (!warming || Date.now() - t0 >= maxMs) { clearInterval(iv); resolve() }
    }, 25)
  })
}

function stopWarm (reason) {
  if (warmTimer) { clearTimeout(warmTimer); warmTimer = null }
  if (warmStream) {
    try { warmStream.getTracks().forEach(t => t.stop()) } catch {}
    if (String(reason) === 'expired') ipcRenderer.send('capture-timing', { phase: 'warm-expired' })
  }
  warmStream = null; warmMonitorIdx = null; warmAt = 0
}

async function warmCapture (monitorIdx) {
  if (sessionId) return { ok: false, reason: 'streaming' }
  const idx = Math.max(0, Number(monitorIdx) || 0)
  if (warmStream && warmMonitorIdx === idx && (Date.now() - warmAt) < 45000) return { ok: true, warm: true }
  if (warming) return { ok: false, reason: 'warming' }
  warming = true
  stopWarm('replace')

  const t0 = Date.now()
  let s = null
  try {
    s = await navigator.mediaDevices.getDisplayMedia({ video: { cursor: 'never' }, audio: true })
  } catch (e0) {
    try { s = await navigator.mediaDevices.getDisplayMedia({ video: true, audio: true }) } catch (e1) { s = null }
  }
  if (!s) {
    try {
      const sources = await getSources()
      if (sources.length) {
        s = await navigator.mediaDevices.getUserMedia({
          audio: false,
          video: { mandatory: { chromeMediaSource: 'desktop', chromeMediaSourceId: sources[idx].id, maxWidth: 1920, maxHeight: 1080, cursor: 'never' } }
        })
      }
    } catch (e2) { s = null }
  }
  if (!s) { warming = false; ipcRenderer.send('capture-timing', { phase: 'warm-failed', monitor: idx, ms: Date.now() - t0 }); return { ok: false } }

  // لا يُعلن التدفق «جاهزاً» قبل أن يصبح الفيديو قابلاً للرسم: الإعلان المبكر كان
  // يجعل مسار إعادة الاستخدام يبدأ بمؤشر على تدفق غير جاهز فيتوقف البث صامتاً.
  video.srcObject = s
  try {
    await new Promise(resolve => {
      if (video.readyState >= 1) return resolve()
      video.onloadedmetadata = resolve
      setTimeout(resolve, 3000)
    })
  } catch {}
  try { video.muted = true; await video.play() } catch {}
  warmStream = s; warmMonitorIdx = idx; warmAt = Date.now()
  warming = false
  ipcRenderer.send('capture-timing', { phase: 'warm-ready', monitor: idx, ms: Date.now() - t0 })
  warmTimer = setTimeout(() => stopWarm('expired'), 45000)
  return { ok: true }
}

ipcRenderer.on('warm-capture', (_, p) => { warmCapture((p && p.monitorIndex) || 0) })

// ── Stop capture ─────────────────────────────────────────────────────────
function stopCapture() {
  stopAudioRecorder()
  if (captureTimer !== null) { clearTimeout(captureTimer); captureTimer = null }
  if (stream)       { stream.getTracks().forEach(t => t.stop()); stream = null }
  video.srcObject = null
  frameSeq = 0
  encoding = false
  lastFullAt = 0
  prevSample = null
}

// ── IPC from main process ─────────────────────────────────────────────────
ipcRenderer.on('start-capture', (_, p) => {
  startCapture(p.sessionId, p.fps, p.quality, p.monitorIndex || 0, p.maxWidth)
})

ipcRenderer.on('stop-capture', (_, p) => {
  if (!p.sessionId || p.sessionId === sessionId) {
    audioWanted = false
    stopCapture()
    sessionId = null
  }
})

// Explicit audio control from the dashboard. Audio was previously started
// automatically with every capture, adding load and making the speaker button
// cosmetic on Windows.
ipcRenderer.on('audio-control', (_, p) => {
  if (p.sessionId && sessionId && p.sessionId !== sessionId) return
  audioWanted = !!p.enabled
  if (!audioWanted) {
    stopAudioRecorder()
    ipcRenderer.send('audio-status', { sessionId, ok: true, enabled: false })
  } else if (sessionId) {
    startAudioRecorder(sessionId)
  }
})

// v3.8.12 — طلب إطار كامل فوري (التحاق مشاهد جديد أو تبديل شاشة)
ipcRenderer.on('force-keyframe', () => {
  forceFull = true
})

ipcRenderer.on('set-quality', (_, p) => {
  if (p.fps)     currentFps     = Math.max(1, Math.min(30, p.fps))
  if (p.quality) currentQuality = Math.max(10, Math.min(95, p.quality))
  if (p.maxWidth) currentMaxWidth = Math.max(320, Math.min(3840, p.maxWidth))
  if (captureTimer !== null) armTimer(10)
})

ipcRenderer.on('display-changed', () => {
  // resolution switch — restart capture against fresh sources
  if (!sessionId) return
  const now = Date.now()
  if (now - lastTrackRestartAt < 2500) return
  lastTrackRestartAt = now
  setTimeout(() => { try { if (sessionId) startCapture(sessionId, currentFps, currentQuality, lastMonitorIdx, currentMaxWidth) } catch {} }, 700)
})

ipcRenderer.on('get-monitors', (_, p) => {
  getSources().then(sources => {
    ipcRenderer.send('screen-monitors', {
      sessionId: p.sessionId,
      monitors:  sources.map((s, i) => ({ id: i, name: s.name, primary: i === 0 }))
    })
  }).catch(() => {
    ipcRenderer.send('screen-monitors', {
      sessionId: p.sessionId,
      monitors:  [{ id: 0, name: 'Screen 1', primary: true }]
    })
  })
})

ipcRenderer.on('set-monitor', (_, p) => {
  startCapture(p.sessionId || sessionId, p.fps || currentFps, p.quality || currentQuality, p.monitorId || 0, p.maxWidth || currentMaxWidth)
})

</script>
</body>
</html>
