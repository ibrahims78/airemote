<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden;
    font-family: "Segoe UI", Tahoma, sans-serif; }
  .card { position: relative; height: 100%; display: flex; gap: 12px; align-items: flex-start;
    padding: 14px; border-radius: 14px; overflow: hidden;
    background: rgba(21,24,29,.97); color: #eef2f6;
    border: 1px solid rgba(45,212,191,.30);
    box-shadow: 0 12px 32px rgba(0,0,0,.45); cursor: pointer; user-select: none; }
  .card:hover { border-color: rgba(45,212,191,.55); }
  .icon { width: 38px; height: 38px; flex: 0 0 38px; border-radius: 10px; display: grid;
    place-items: center; background: rgba(45,212,191,.14); color: #2dd4bf; font-size: 19px; }
  .body { min-width: 0; flex: 1; }
  .eyebrow { font-size: 11px; color: #7dd3c7; margin-bottom: 3px; }
  .sender { font-size: 13px; font-weight: 700; color: #fff; margin-bottom: 3px; }
  .text { font-size: 13px; line-height: 1.45; color: #cbd5e1;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .close { position: absolute; top: 7px; left: 7px; width: 22px; height: 22px; border: 0;
    border-radius: 6px; background: transparent; color: #94a3b8; font-size: 15px;
    line-height: 1; cursor: pointer; display: grid; place-items: center; }
  .close:hover { background: rgba(255,255,255,.08); color: #fff; }
  .bar { position: absolute; bottom: 0; right: 0; height: 2px; width: 100%;
    background: linear-gradient(90deg,#2dd4bf,#38bdf8); transform-origin: right;
    animation: shrink 6.5s linear forwards; }
  @keyframes shrink { from { transform: scaleX(1); } to { transform: scaleX(0); } }
</style>
</head>
<body>
  <div class="card" id="card">
    <div class="icon">&#128172;</div>
    <div class="body">
      <div class="eyebrow">رسالة جديدة من مشاهد</div>
      <div class="sender" id="sender">مشاهد</div>
      <div class="text" id="text"></div>
    </div>
    <button class="close" id="close" title="إغلاق">×</button>
    <div class="bar" id="bar"></div>
  </div>
<script>
  const api = window.toastApi || {}
  const senderEl = document.getElementById('sender')
  const textEl = document.getElementById('text')
  function render (sender, text) {
    senderEl.textContent = sender || 'مشاهد'
    textEl.textContent = text || ''
    const bar = document.getElementById('bar')
    bar.style.animation = 'none'; void bar.offsetWidth
    bar.style.animation = 'shrink 6.5s linear forwards'
  }
  render('', '')
  if (api.onUpdate) api.onUpdate(d => render(d.sender, d.text))
  document.getElementById('card').addEventListener('click', () => api.open && api.open())
  document.getElementById('close').addEventListener('click', e => { e.stopPropagation(); api.close && api.close() })
</script>
</body>
</html>
