<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>AiRemote RTC</title>
</head>
<body>
  <!-- 3.12.0 (M1) — نافذة مخفية: canvas يُغذّى من إطارات GDI، وcaptureStream يسلّمها لـWebRTC.
       لا تلتقط الشاشة هنا: المصدر هو عامل GDI (الذي أثبت أنه يعمل على ضيوف VMware). -->
  <canvas id="c" width="1600" height="677" style="display:none"></canvas>
  <script>
    const { ipcRenderer } = require('electron')
    const canvas = document.getElementById('c')
    const ctx = canvas.getContext('2d', { alpha: false })

    let pc = null
    let sender = null
    let sessionId = null
    let started = false
    let lastBitmap = null
    let safetyTimer = null
    let drawn = 0
    let decoded = 0
    let painted = 0

    function out (data) { try { ipcRenderer.send('rtc-signal-out', data) } catch {} }
    function diag (m) { try { ipcRenderer.send('rtc-log', m) } catch {} }
    window.addEventListener('error', (e) => diag('pageerror ' + (e && e.message)))
    diag('rtc page loaded')

    // 3.12.2 (M1) — الـcanvas يُغذّى بكل إطار GDI عبر createImageBitmap (بدل Image+objectURL)،
    // وإطار أمان 30fps يعيد رسم آخر إطار حتى لا ينهار معدّل الإطارات عند السكون.
    function drawBitmap (bmp) {
      try {
        if (canvas.width !== bmp.width || canvas.height !== bmp.height) {
          canvas.width = bmp.width
          canvas.height = bmp.height
          diag('canvas ' + canvas.width + 'x' + canvas.height)
        }
        ctx.drawImage(bmp, 0, 0)
        return true
      } catch (e) { diag('draw failed ' + (e && e.message)); return false }
    }

    function startSafetyLoop () {
      if (safetyTimer) return
      safetyTimer = setInterval(() => {
        if (!lastBitmap) return
        try { ctx.drawImage(lastBitmap, 0, 0); painted++ } catch (e) {}
      }, 33)
      diag('safety loop 30fps started')
    }

    // 3.12.1 (M1) — إعادة تطبيق معاملات المُرسِل. في Chromium لا تُحفظ قيم setParameters
    // قبل التفاوض (encodings تُبنى عنده)، فتُطبَّق هنا بعد إنشاء المتسقّل وبعد الاتصال.
    async function applyEncodingParams (tag) {
      try {
        const p = sender.getParameters()
        if (!p.encodings || !p.encodings.length) p.encodings = [{}]
        p.encodings[0].maxBitrate = 4000000
        p.encodings[0].maxFramerate = 30
        p.encodings[0].scaleResolutionDownBy = 1
        // 3.12.2 (M1) — المكان الصحيح للتفضيل هو RTCRtpSendParameters (لا المتسقّل:
        // transceiver.degradationPreference كائن JS وهمي لا يصل المُرمّز).
        p.degradationPreference = 'maintain-resolution'
        await sender.setParameters(p)
        const q = sender.getParameters()
        diag('params[' + tag + '] ' + JSON.stringify(q.encodings && q.encodings[0]) + ' pref=' + q.degradationPreference)
      } catch (e) { diag('params[' + tag + '] failed ' + (e && e.message)) }
    }

    async function start (sid) {
      diag('start ' + sid)
      sessionId = sid
      if (pc) { try { pc.close() } catch (e) {} ; pc = null }
      pc = new RTCPeerConnection({ iceServers: [] })
      const stream = canvas.captureStream(30)
      startSafetyLoop()
      const track = stream.getVideoTracks()[0]
      // 3.12.1 (M1) — sendEncodings عند إنشاء المتسقّل، لأن setParameters قبل أول عرض
      // لا يُطبَّق في Chromium. وdegradationPreference على المتسقّل (لا في setParameters).
      let tr = null
      try {
        // streams: [stream] ضروري: بدونه لا يجد المشاهد e.streams[0] فيبقى <video> بلا مصدر.
        tr = pc.addTransceiver(track, { direction: 'sendonly', streams: [stream], sendEncodings: [{ maxBitrate: 4000000, maxFramerate: 30, scaleResolutionDownBy: 1 }] })
        sender = tr.sender
      } catch (e) {
        diag('addTransceiver failed ' + (e && e.message) + ' — fallback addTrack')
        sender = pc.addTrack(track, stream)
        tr = pc.getTransceivers()[0] || null
      }
      // ملاحظة 3.12.2: لا نضبط degradationPreference على المتسقّل — لا يصل المُرمّز.
      try { track.contentHint = 'detail' } catch (e) {}
      diag('transceiver dir=' + (tr && tr.direction) + ' contentHint=' + track.contentHint)
      try { diag('track settings ' + JSON.stringify(track.getSettings ? track.getSettings() : {})) } catch (e) {}
      diag('canvas ' + canvas.width + 'x' + canvas.height)
      await applyEncodingParams('pre-offer')
      pc.onicecandidate = (ev) => {
        if (ev.candidate) { const cd = ev.candidate; out({ candidate: { candidate: cd.candidate, sdpMid: cd.sdpMid, sdpMLineIndex: cd.sdpMLineIndex } }) }
      }
      pc.onconnectionstatechange = () => {
        try { diag('pc=' + pc.connectionState) } catch (e) {}
        if (pc.connectionState === 'connected') {
          applyEncodingParams('connected').catch(() => {})
          setTimeout(() => { applyEncodingParams('t+4s').catch(() => {}) }, 4000)
        }
      }
      const offer = await pc.createOffer()
      await pc.setLocalDescription(offer)
      out({ sdp: { type: pc.localDescription.type, sdp: pc.localDescription.sdp } })
      started = true
    }

    ipcRenderer.on('rtc-start', (e, msg) => { start(msg && msg.sessionId).catch(() => {}) })

    ipcRenderer.on('rtc-frame', async (e, msg) => {
      if (!msg || !msg.jpeg) return
      decoded++
      try {
        const bmp = await createImageBitmap(new Blob([msg.jpeg], { type: 'image/jpeg' }))
        lastBitmap = bmp
        if (drawBitmap(bmp)) {
          drawn++
          if (drawn === 1 || drawn % 90 === 0) diag('drawn=' + drawn + ' decoded=' + decoded + ' painted=' + painted + ' canvas=' + canvas.width + 'x' + canvas.height)
        }
      } catch (err) { diag('frame decode failed ' + (err && err.message)) }
    })

    ipcRenderer.on('rtc-signal', async (e, data) => {
      if (!pc || !data) return
      try {
        if (data.sdp) {
          await pc.setRemoteDescription(data.sdp)
          if (data.sdp.type === 'offer') {
            const ans = await pc.createAnswer()
            await pc.setLocalDescription(ans)
            out({ sdp: { type: pc.localDescription.type, sdp: pc.localDescription.sdp } })
          }
        } else if (data.candidate) {
          await pc.addIceCandidate(data.candidate)
        }
      } catch (err) { try { console.log('[rtc] signal err ' + (err && err.message)) } catch (e) {} }
    })
  </script>
</body>
</html>
