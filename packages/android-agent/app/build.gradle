plugins { id 'com.android.application' }

// P6 — مصدر واحد للحقيقة: اسم الإصدار من ملف VERSION في جذر المستودع، لا رقم مكتوب بيد.
// versionCode يبقى رقمياً تصاعدياً (أندرويد يرفض التثبيت إن لم يزد).
def versionFile = rootProject.file('../../VERSION')
def appVersionName = versionFile.exists() ? versionFile.text.trim() : '0.0.0'

android {
    namespace 'com.airemote.agent'
    compileSdk 35

    defaultConfig {
        applicationId "com.airemote.agent"
        minSdk 24
        targetSdk 33
        versionCode 100
        versionName appVersionName
    }

    buildTypes {
        release { minifyEnabled false }
        debug { }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures { buildConfig true }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

dependencies {
    implementation 'org.java-websocket:Java-WebSocket:1.5.7'
    implementation 'org.slf4j:slf4j-nop:1.7.36'
}
