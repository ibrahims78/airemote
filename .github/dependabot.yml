version: 2
# W1-2 — فحص دوري أسبوعي للتبعيات (npm) وأفعال GitHub (github-actions).
# ملاحظة (2026-11-17): GitHub غير مرتبط بعد — قرار المالك المقفل: لا يُربط إلا بكلمة «اربط GitHub».
# هذا الملف جاهز ويعمل تلقائياً فور ربط المستودع بـGitHub.
# reviewers تُضاف بعد أن يوجد للمالك حساب GitHub (لا اسم وهمي هنا).
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
